[package]
name = "upstash-ddns"
version = "0.1.0"
edition = "2024"

description = "A small command-line client for Upstash-backed IPv6 records"
license = "MIT"
repository = "https://example.invalid/upstash-ddns"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
urlencoding = "2"

